[package]
name = "oopsie"
version = "2.0.1"
description = "Media creator desktop suite"
authors = ["Alter"]
edition = "2021"

[lib]
name = "oopsie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
dirs = "5"
image = "0.25"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
once_cell = "1"

[profile.dev]
# Faster incremental compiles for this large app during development
opt-level = 0

[profile.release]
opt-level = 2

# Optimize dependencies even in dev so image/ffmpeg-adjacent pixel work is fast
# (keeps our own crate unoptimized for quick incremental compiles).
[profile.dev.package."*"]
opt-level = 3
